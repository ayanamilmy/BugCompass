[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugcompass"
version = "0.5.1"
description = "面向 Blender Bug 调查的本地案件工作区工具"
readme = "README.zh-CN.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BugCompass contributors"}]
dependencies = []

[project.scripts]
bugcompass = "bugcompass.cli:main"

[project.urls]
Repository = "https://github.com/ayanamilmy/BugCompass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
